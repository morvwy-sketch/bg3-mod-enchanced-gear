name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.4 and luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 lua-check
          lua5.4 -v
          luacheck --version

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install Python dependencies
        run: pip install -r tools/requirements.txt

      - name: Lua tests
        run: lua5.4 tests/run.lua

      - name: Luacheck
        run: luacheck mod tools tests

      - name: Build package
        run: ./tools/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: EnhancedGear
          path: dist/
          if-no-files-found: error
